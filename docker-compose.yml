services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taqr
      POSTGRES_PASSWORD: taqr
      POSTGRES_DB: BIRD
    ports:
      - "5432:5432"
    volumes:
      - taqr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taqr -d BIRD"]
      interval: 2s
      timeout: 5s
      retries: 15

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      # for watch to work on wsl2
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: ./ui/src
          target: /app/src
        - action: rebuild
          path: ./ui/package.json

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - /ui
            - /.git
            - /.venv
            - /__pycache__
            - "**/__pycache__"
            - /.pytest_cache
            - /.ruff_cache
        - action: rebuild
          path: ./pyproject.toml
          ignore:
            - /ui

volumes:
  taqr_pgdata:
